name: .NET CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [8.0]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore

      - name: Build App
        run: bash ./scripts/build-app.sh src/ITStockM.WebApi/ITStockM.WebApi.csproj

      - name: Architecture Regression Guard
        run: bash ./scripts/check-architecture-regressions.sh

      - name: Warning Budget Check
        run: bash ./scripts/check-warning-budget.sh

  build-solution:
    runs-on: ubuntu-latest
    needs: [build-app]
    strategy:
      matrix:
        dotnet-version: [8.0]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Build Solution
        run: bash ./scripts/build-solution.sh ITStockM.sln

  test:
    runs-on: ubuntu-latest
    needs: [build-solution]
    strategy:
      matrix:
        dotnet-version: [8.0]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Build Tests
        run: bash ./scripts/build-tests.sh src/ITStockM.Tests/ITStockM.Tests.csproj

      - name: Test
        run: dotnet test src/ITStockM.Tests/ITStockM.Tests.csproj --no-build --verbosity normal
