services:
  sqlserver:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: itstockm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-AsteelFlash@2026}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - itstockm-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  smtpdev:
    image: "rnwood/smtp4dev:latest"
    container_name: itstockm-smtpdev
    ports:
      - "5025:25"   # SMTP port
      - "5080:80"   # web UI
    environment:
      - "ASPNETCORE_ENVIRONMENT=Development"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Database GUI (CloudBeaver) for SQL Server inspection/editing in browser
  db-gui:
    image: dbeaver/cloudbeaver:latest
    container_name: itstockm-db-gui
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "true"
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
      CLOUDBEAVER_APP_SUPPORTS_CUSTOM_CONNECTIONS: "true"
    ports:
      - "8978:8978"
    volumes:
      - itstockm-cloudbeaver-data:/opt/cloudbeaver/workspace
      - ./cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro

  # AD/LDAP simulation for local AD-enabled auth (demo users + groups)
  ldap:
    image: osixia/openldap:1.5.0
    container_name: itstockm-ldap
    environment:
      LDAP_ORGANISATION: "Asteelflash"
      LDAP_DOMAIN: "asteelflash.com"
      LDAP_BASE_DN: "dc=asteelflash,dc=com"
      LDAP_ADMIN_PASSWORD: "admin1234"
      # Base DB backend
      LDAP_CONFIG_PASSWORD: "config1234"
    ports:
      - "389:389"
    volumes:
      - itstockm-ldap-data:/var/lib/ldap
      - itstockm-ldap-config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b '' -s base -LL '(objectClass=*)' dn >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # One-shot LDIF importer.
  # Rationale: avoid bind-mounting into osixia bootstrap paths (breaks startup with "Device or resource busy").
  ldap-seed:
    image: osixia/openldap:1.5.0
    container_name: itstockm-ldap-seed
    entrypoint: ["/bin/bash", "-lc"]
    depends_on:
      ldap:
        condition: service_healthy
    volumes:
      - ./ldap:/seeds:ro
    environment:
      LDAP_ADMIN_PASSWORD: "admin1234"
      LDAP_BASE_DN: "dc=asteelflash,dc=com"
    command:
      - >
        set -euo pipefail;
        ADMIN_DN="cn=admin,$$LDAP_BASE_DN";
        command -v ldapadd >/dev/null 2>&1 || { echo 'ldapadd not found in image'; exit 1; };
        until ldapsearch -x -H ldap://ldap:389 -D "$$ADMIN_DN" -w "$$LDAP_ADMIN_PASSWORD" -b '' -s base dn >/dev/null 2>&1; do
          echo 'Waiting for LDAP...'; sleep 2;
        done;
        if ldapsearch -x -H ldap://ldap:389 -D "$$ADMIN_DN" -w "$$LDAP_ADMIN_PASSWORD" -b "$$LDAP_BASE_DN" "(uid=admin)" dn >/dev/null 2>&1 &&
           ldapsearch -x -H ldap://ldap:389 -D "$$ADMIN_DN" -w "$$LDAP_ADMIN_PASSWORD" -b "$$LDAP_BASE_DN" "(uid=admin)" dn | grep -q '^dn:'; then
          echo 'LDAP baseline already present; skipping seed import.';
        else
          ldapadd -c -x -H ldap://ldap:389 -D "$$ADMIN_DN" -w "$$LDAP_ADMIN_PASSWORD" -f /seeds/seed.ldif || true;
          ldapsearch -x -H ldap://ldap:389 -D "$$ADMIN_DN" -w "$$LDAP_ADMIN_PASSWORD" -b "$$LDAP_BASE_DN" "(uid=admin)" dn | grep -q '^dn:' || { echo 'LDAP seed failed: admin account not found'; exit 1; };
        fi;
        if [ -f /seeds/memberof-overlay.ldif ] && grep -Eq '^[[:space:]]*dn:' /seeds/memberof-overlay.ldif; then
          ldapadd -x -H ldap://ldap:389 -D "$$ADMIN_DN" -w "$$LDAP_ADMIN_PASSWORD" -f /seeds/memberof-overlay.ldif || true;
        fi;
        echo 'LDAP seeding completed.'
    restart: "no"


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itstockm-app
    depends_on:
      sqlserver:
        condition: service_healthy
      smtpdev:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      # Optional Gemini API key (set in shell/.env; never hardcode secrets here)
      GEMINI_API_KEY: "${GEMINI_API_KEY:-AQ.Ab8RN6InJW7kBI6E4MBapdPZzL2kNWXfWiVe13jKmB06XvEwmA}"
      
      # SQL Server 2022
      ConnectionStrings__ITStockManagmentConnection: "Server=sqlserver,1433;Database=ITStockM;User Id=sa;Password=${MSSQL_SA_PASSWORD:-AsteelFlash@2026};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      
      # LanSweeper – uses the same SQL Server, separate database auto-created on startup
      ConnectionStrings__LanSweeperConnection: "Server=sqlserver,1433;Database=lansweeperdb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-AsteelFlash@2026};TrustServerCertificate=True;Encrypt=False"
      
      # Application Settings
      DEV_ALLOW_TEST_EMAIL: "${DEV_ALLOW_TEST_EMAIL:-true}"

      # Active Directory (LDAP) configuration for AD-only authentication + auto-provisioning
      # Enable with ACTIVE_DIRECTORY_ENABLED=true and provide the LDAP connection details.
      # Defaults are set for local Docker LDAP simulation.
      ActiveDirectory__Enabled: "${ACTIVE_DIRECTORY_ENABLED:-true}"
      ActiveDirectory__LdapPath: "${ACTIVE_DIRECTORY_LDAP_PATH:-ldap://ldap:389}"
      ActiveDirectory__Domain: "${ACTIVE_DIRECTORY_DOMAIN:-asteelflash.com}"
      ActiveDirectory__SearchBase: "${ACTIVE_DIRECTORY_SEARCH_BASE:-dc=asteelflash,dc=com}"
      ActiveDirectory__BindDn: "${ACTIVE_DIRECTORY_BIND_DN:-cn=admin,dc=asteelflash,dc=com}"
      ActiveDirectory__BindPassword: "${ACTIVE_DIRECTORY_BIND_PASSWORD:-admin1234}"
      ActiveDirectory__UserDnPattern: "${ACTIVE_DIRECTORY_USER_DN_PATTERN:-uid={0},ou=people,dc=asteelflash,dc=com}"
      ActiveDirectory__TimeoutSeconds: "${ACTIVE_DIRECTORY_TIMEOUT_SECONDS:-5}"
      
      # Seed (demo/admin)
      # Business DB seed is separate from LDAP directory seed.
      Seed__Enabled: "${SEED_ENABLED:-true}"
      Seed__DemoData: "${SEED_DEMO_DATA:-true}"
      Seed__ClearOldData: "${SEED_CLEAR_OLD_DATA:-false}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-admin@asteelflash.com}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-admin1234}"
      Seed__AdminFullName: "${SEED_ADMIN_FULLNAME:-Admin User}"
      Seed__AdminPhoneNumber: "${SEED_ADMIN_PHONE:-+0000000000}"
      Seed__AdminService: "${SEED_ADMIN_SERVICE:-IT}"
      
      # Email settings - Environment variables for EmailService and OperationNotificationService
      # For local dev, use smtpdev container (port 25, no auth needed)
      SMTP_SERVER: "${SMTP_SERVER:-smtpdev}"
      SMTP_PORT: "${SMTP_PORT:-25}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-system@asteelflash.com}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_ADMIN_EMAIL: "${SMTP_ADMIN_EMAIL:-admin@asteelflash.com}"
      
      # Legacy email settings (for backward compatibility)
      EmailSettings__SmtpServer: "${SMTP_SERVER:-smtpdev}"
      EmailSettings__SmtpPort: "${SMTP_PORT:-25}"
      EmailSettings__FromEmail: "${SMTP_FROM_EMAIL:-system@asteelflash.com}"
      EmailSettings__Password: "${SMTP_PASSWORD:-}"
      EmailSettings__AdminEmail: "${SMTP_ADMIN_EMAIL:-admin@asteelflash.com}"
      
      # SMTP health check options (dev-only)
      SMTP_HEALTH_CHECK_ON_STARTUP: "${SMTP_HEALTH_CHECK_ON_STARTUP:-false}"
      SMTP_HEALTH_CHECK_SEND: "${SMTP_HEALTH_CHECK_SEND:-false}"
      
      # Logging
      Serilog__MinimumLevel: "Information"
      
    ports:
      - "8080:8080"
    volumes:
      - itstockm-dpkeys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  itstockm-sqlserver-data:
  itstockm-dpkeys:
  itstockm-ldap-data:
  itstockm-ldap-config:
  itstockm-cloudbeaver-data:
